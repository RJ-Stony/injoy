name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages 공식 권장 패턴: 진행 중인 배포는 끝까지 두고 새 푸시는 큐에 쌓는다.
# (배포 도중 취소하면 단일 'github-pages' 환경이 꼬일 수 있다.)
concurrency:
  group: pages
  cancel-in-progress: false

# 빌드와 배포를 한 잡으로 합쳤다. 잡을 나누면 deploy가 러너를 한 번 더 기다려
# (호스티드 러너 배정 대기가 두 번) 배포가 느려진다. 성공이 대부분이라 한 잡이 빠르다.
# deploy가 드물게 실패하면(대개 Pages 레이트리밋) rerun 대신 커밋 모아 다시 push한다.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fetch-depth: 0 — 통계 잔디가 글 .md의 전체 커밋 히스토리를 읽는다(얕은 클론이면 수정이 0으로 나옴).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # withastro/action이 설치·빌드 후 pages 아티팩트(github-pages)를 업로드한다.
      - uses: withastro/action@v6
      - id: deployment
        uses: actions/deploy-pages@v4
