name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages 공식 권장 패턴: 진행 중인 배포는 끝까지 두고 새 푸시는 큐에 쌓는다.
# (배포 도중 취소하면 단일 'github-pages' 환경이 꼬일 수 있다.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 빌드/배포를 두 잡으로 나눈다(공식 권장). 러너 스핀업이 한 번 더 들지만,
  # deploy가 Pages 인프라 사정으로 실패해도(간헐 'Deployment failed, try again later')
  # 아티팩트를 다시 올리지 않고 실패한 deploy 잡만 안전하게 재실행할 수 있다
  # (`gh run rerun <id> --failed`). 단일 잡이면 재실행이 아티팩트를 중복 업로드해
  # 'Multiple artifacts named github-pages'로 되레 깨진다.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # withastro/action이 설치·빌드 후 pages 아티팩트(github-pages)를 업로드한다.
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
