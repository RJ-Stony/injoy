# Injoy 로컬 글쓰기 설정 (npm run write)
#
# local_backend: 로컬에서 decap-server(8081)와 통신해 레포 파일을 직접 읽고 쓴다.
# 아래 backend 블록은 Decap이 요구하는 형식상 선언일 뿐, OAuth를 구성하지 않았고
# 프로덕션 빌드에서는 admin 자체가 제거되므로 외부에서 글을 쓸 방법은 없다.
backend:
  name: github
  repo: RJ-Stony/injoy
  branch: main

local_backend: true
publish_mode: simple
site_url: https://rj-stony.github.io/injoy
display_url: https://rj-stony.github.io/injoy
locale: ko

# 업로드 이미지는 글 옆 _images/에 저장 → 마크다운에서 상대 경로로 참조
# (Astro가 자동 최적화 + lazy 로딩, 콘텐츠 글로브(*.md)에는 안 걸림)
media_folder: src/content/posts/_images
public_folder: ./_images

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{title}} — {{category}} ({{pubDate}})'
    sortable_fields: [pubDate, title]
    view_filters:
      - label: 초안만
        field: draft
        pattern: true
      - label: 발행된 글만
        field: draft
        pattern: false
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: description, label: 한 줄 요약, widget: string, hint: '홈 카드·검색·공유 미리보기에 쓰여요' }
      - { name: pubDate, label: 발행일, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { name: category, label: 카테고리, widget: string, default: 개발, hint: '예: 개발, 회고, 데이터' }
      - { name: tags, label: 태그, widget: list, required: false, default: [], hint: '쉼표로 구분해 입력' }
      - { name: draft, label: 초안 (체크하면 사이트에 안 보여요), widget: boolean, default: true, required: false }
      - { name: cover, label: 대표 이미지 (썸네일), widget: image, required: false }
      - { name: body, label: 본문, widget: markdown }
